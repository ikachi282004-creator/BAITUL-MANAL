<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile & Purchases — BAITUL MANAL Kuwait</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root {
      --bm-gold: #c5a880;
      --bm-gold-dark: #9e825a;
      --bm-dark: #181512;
      --bm-card-bg: #fff;
      --bm-border: #d6cbba;
    }

    body {
      background-color: #fbf9f6;
      color: var(--bm-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .profile-card {
      background: var(--bm-card-bg);
      border: 1px solid var(--bm-border);
      border-radius: 10px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #8c8173;
      text-align: center;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .phone-sync-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .input-field {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--bm-border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    .btn-sync {
      background: var(--bm-gold);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-links {
      margin-top: 30px;
      text-align: center;
    }

    .nav-links a {
      color: var(--bm-gold-dark);
      text-decoration: none;
      font-size: 0.9rem;
      margin: 0 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-card">
      <h1 class="title">Customer Atelier Profile</h1>
      <p class="subtitle">Access your dispatch history and couture acquisitions across Kuwait</p>

      <div class="phone-sync-box">
        <input type="tel" id="profilePhoneInput" class="input-field" placeholder="Enter Mobile Number (e.g. 96560454629)">
        <button type="button" id="fetchProfileOrdersBtn" class="btn-sync">Load Orders</button>
      </div>

      <div id="profileOrdersList">
        <p style="text-align:center; color:#8c8173; padding: 2rem 0;">Enter your mobile number above to retrieve order records.</p>
      </div>

      <div class="nav-links">
        <a href="index.html">← Return to Boutique</a>
        <a href="track-order.html">Track Single Dispatch</a>
      </div>
    </div>
  </div>

  <script src="assets/js/profile.js"></script>
</body>
</html>
