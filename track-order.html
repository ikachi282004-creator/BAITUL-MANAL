<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — BAITUL MANAL Kuwait</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root {
      --bm-gold: #c5a880;
      --bm-gold-dark: #9e825a;
      --bm-dark: #181512;
      --bm-card-bg: #fff;
      --bm-border: #d6cbba;
    }

    body {
      background-color: #fbf9f6;
      color: var(--bm-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .tracking-card {
      background: var(--bm-card-bg);
      border: 1px solid var(--bm-border);
      border-radius: 10px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      color: var(--bm-dark);
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #8c8173;
      text-align: center;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .search-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--bm-border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--bm-gold);
    }

    .btn-track {
      background: var(--bm-gold);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-track:hover {
      background: #b5966d;
    }

    .nav-links {
      margin-top: 24px;
      text-align: center;
    }

    .nav-links a {
      color: var(--bm-gold-dark);
      text-decoration: none;
      font-size: 0.9rem;
      margin: 0 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tracking-card">
      <h1 class="title">Track Order Dispatch</h1>
      <p class="subtitle">Enter your Order Reference (e.g. BM-KW-2026-XXXX) or Contact Phone Number</p>

      <form id="trackOrderForm" class="search-group">
        <input type="text" id="orderTrackingInput" class="search-input" placeholder="e.g. BM-KW-2026-1045 or 96560454629" required>
        <button type="submit" class="btn-track">Track Order</button>
      </form>

      <div id="trackingResultsCard" style="display: none;"></div>

      <div class="nav-links">
        <a href="index.html">← Return to Boutique</a>
        <a href="my-profile.html">View Order History</a>
      </div>
    </div>
  </div>

  <script src="assets/js/track-order.js"></script>
  <script>
    // Auto-detect URL parameter (?id=...) from checkout redirect
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');
      if (orderId) {
        const input = document.getElementById('orderTrackingInput');
        if (input) {
          input.value = orderId;
          document.getElementById('trackOrderForm').dispatchEvent(new Event('submit'));
        }
      }
    });
  </script>
</body>
</html>
